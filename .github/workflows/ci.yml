name: CI

on:
  pull_request:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate action contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail
          version="v4.44.3"
          install_dir="${RUNNER_TEMP}/rabbit-action-bin"
          mkdir -p "$install_dir"
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${version}/yq_linux_amd64" -o "$install_dir/yq"
          chmod +x "$install_dir/yq"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run validation
        shell: bash
        run: make test

  lint-workflows:
    name: lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        shell: bash
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
