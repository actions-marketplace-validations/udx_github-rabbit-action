name: Verify release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published semantic tag to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify action release
    runs-on: ubuntu-latest
    steps:
      - name: Validate semantic release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid release tag::Expected a semantic patch tag such as v1.0.3, got $RELEASE_TAG."
            exit 1
          fi

      - name: Checkout release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail
          version="v4.44.3"
          install_dir="${RUNNER_TEMP}/rabbit-action-bin"
          mkdir -p "$install_dir"
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${version}/yq_linux_amd64" -o "$install_dir/yq"
          chmod +x "$install_dir/yq"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Verify release contract
        shell: bash
        run: make test
